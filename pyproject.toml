[project]
name = "cradlewise-local"
version = "0.1.0"
description = "Local Cradlewise bridge and Home Assistant integration helpers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "aiortc>=1.14.0",
  "boto3",
  "cryptography",
  "numpy",
  "paho-mqtt>=2.0.0",
  "pycognito",
  "requests",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
]

[project.scripts]
cradlewise-local = "cradlewise_local.__main__:main"

[project.urls]
Homepage = "https://github.com/caffeineflo/cradlewise-local"
Issues = "https://github.com/caffeineflo/cradlewise-local/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cradlewise_local"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
