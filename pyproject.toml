[project]
name = "cradlewise-local"
version = "0.1.0"
description = "Local Cradlewise bridge and Home Assistant integration helpers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "aiortc==1.15.0",
  "cradlewise-client==0.1.0",
  "numpy",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.5",
  "yamllint==1.38.0",
]
ha-test = [
  "PyTurboJPEG==2.5.0; python_full_version >= '3.14.2'",
  "ha-ffmpeg==3.2.2; python_full_version >= '3.14.2'",
  "pytest-homeassistant-custom-component==0.13.357; python_full_version >= '3.14.2'",
]
observability = [
  "sentry-sdk>=2.68.0,<3.0.0",
]

[project.scripts]
cradlewise-local = "cradlewise_local.__main__:main"
cradlewise-pin-mqtt-ca = "cradlewise_local.mqtt_ca:main"

[project.urls]
Homepage = "https://github.com/caffeineflo/cradlewise-home-assistant"
Issues = "https://github.com/caffeineflo/cradlewise-home-assistant/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cradlewise_local"]

[tool.hatch.build.targets.wheel.force-include]
"stream_local.py" = "stream_local.py"
"cradlewise_api.py" = "cradlewise_api.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["enable_socket: allow loopback sockets for bridge HTTP server tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.uv.sources]
cradlewise-client = {workspace = true}

[tool.uv.workspace]
members = ["packages/cradlewise-client"]
