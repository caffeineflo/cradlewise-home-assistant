name: Published image security

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Resolve the latest published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected release version"
            exit 1
          fi
          echo "IMAGE=ghcr.io/caffeineflo/cradlewise-local-bridge:${tag#v}" >> "$GITHUB_ENV"

      - name: Install vulnerability scanner
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.3.1
        with:
          version: v0.74.0

      - name: Scan both published architectures, including unfixed findings
        env:
          PLATFORM: linux/${{ matrix.arch }}
        run: >-
          trivy image --image-src remote --platform "$PLATFORM"
          --scanners vuln --timeout 10m --format json
          --output image-security.json "$IMAGE"

      - name: Fail on newly fixable high and critical vulnerabilities
        env:
          PLATFORM: linux/${{ matrix.arch }}
        run: >-
          trivy image --image-src remote --platform "$PLATFORM"
          --scanners vuln --timeout 10m --ignore-unfixed
          --severity HIGH,CRITICAL --exit-code 1 "$IMAGE"

      - name: Retain complete security report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: published-image-security-${{ matrix.arch }}
          path: image-security.json
          if-no-files-found: error
          retention-days: 30
