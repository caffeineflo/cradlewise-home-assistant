name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BRIDGE_IMAGE: ghcr.io/caffeineflo/cradlewise-local-bridge

jobs:
  dependabot-audit:
    runs-on: ubuntu-latest
    permissions: read-all

    steps:
      - name: Require zero open Dependabot alerts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          open_alerts="$(
            gh api --paginate \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/dependabot/alerts?state=open&per_page=100" \
              --jq '.[].number'
          )"
          if [[ -n "${open_alerts}" ]]; then
            alert_count="$(wc -l <<< "${open_alerts}" | tr -d ' ')"
            echo "::error::Dependabot reports ${alert_count} open vulnerability alert(s)."
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --frozen --python "${{ matrix.python-version }}" --extra test python -m pytest

      - name: Compile Python files
        run: >-
          uv run --frozen --python "${{ matrix.python-version }}" python -m compileall
          cradlewise_local custom_components packages tests stream_local.py cradlewise_api.py

      - name: Build client package
        run: uv build --package cradlewise-client

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"

      - name: Check Python lint
        run: uv run --frozen --python 3.12 --extra test ruff check .

      - name: Check Python formatting
        run: uv run --frozen --python 3.12 --extra test ruff format --check .

      - name: Check YAML
        run: >-
          uv run --frozen --python 3.12 --extra test yamllint
          -d '{extends: default, rules: {document-start: disable, line-length: disable,
          truthy: disable}}' .github examples

  home-assistant-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.14"

      - name: Run Home Assistant integration tests
        run: >-
          uv run --frozen --python 3.14 --extra test --extra ha-test
          python -m pytest tests/test_ha_integration.py tests/test_ha_coordinator.py

  home-assistant-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb  # master

      - name: Run HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa  # main
        with:
          category: integration
          comment: false

  client-package-build:
    runs-on: ubuntu-latest
    needs:
      - dependabot-audit
      - test
      - lint
      - home-assistant-test
      - home-assistant-validation

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"

      - name: Verify release versions
        shell: bash
        run: |
          set -euo pipefail
          expected_version="${GITHUB_REF_NAME#v}"
          client_version=$(uv version --package cradlewise-client --short)
          integration_version=$(python -c 'import json; print(json.load(open("custom_components/cradlewise/manifest.json"))["version"])')
          integration_requirement=$(python -c 'import json; print(json.load(open("custom_components/cradlewise/manifest.json"))["requirements"][0])')
          test "$client_version" = "$expected_version"
          test "$integration_version" = "$expected_version"
          test "$integration_requirement" = "cradlewise-client==$expected_version"

      - name: Build client distribution
        run: uv build --package cradlewise-client

      - name: Upload client distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: cradlewise-client-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  client-package-publish:
    runs-on: ubuntu-latest
    needs: client-package-build
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download client distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: cradlewise-client-dist
          path: dist/

      - name: Publish client distribution to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist/

  bridge-image-publish:
    runs-on: ubuntu-latest
    needs:
      - dependabot-audit
      - test
      - lint
      - home-assistant-test
      - home-assistant-validation
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          images: ${{ env.BRIDGE_IMAGE }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and publish bridge image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    runs-on: ubuntu-latest
    needs:
      - client-package-publish
      - bridge-image-publish
    permissions:
      contents: write

    steps:
      - name: Download client distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: cradlewise-client-dist
          path: dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"
