name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BRIDGE_IMAGE: ghcr.io/caffeineflo/cradlewise-local-bridge

jobs:
  dependabot-audit:
    runs-on: ubuntu-latest
    permissions: read-all

    steps:
      - name: Require zero open Dependabot alerts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          open_alerts="$(
            gh api --paginate \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/dependabot/alerts?state=open&per_page=100" \
              --jq '.[].number'
          )"
          if [[ -n "${open_alerts}" ]]; then
            alert_count="$(wc -l <<< "${open_alerts}" | tr -d ' ')"
            echo "::error::Dependabot reports ${alert_count} open vulnerability alert(s)."
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --locked --python "${{ matrix.python-version }}" --extra test python -m pytest

      - name: Compile Python files
        run: >-
          uv run --locked --python "${{ matrix.python-version }}" python -m compileall
          cradlewise_local custom_components packages tests stream_local.py cradlewise_api.py

      - name: Build client package
        run: uv build --package cradlewise-client

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Check Python lint
        run: uv run --locked --python 3.12 --extra test ruff check .

      - name: Check Python formatting
        run: uv run --locked --python 3.12 --extra test ruff format --check .

      - name: Check YAML
        run: >-
          uv run --locked --python 3.12 --extra test yamllint
          -d '{extends: default, rules: {document-start: disable, line-length: disable,
          truthy: disable}}' .github examples

  home-assistant-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - home-assistant-version: "2026.6.0"
            ha-test-version: "0.13.336"
            minimum: true
          - home-assistant-version: "2026.9.1"
            ha-test-version: "0.13.364"
            minimum: false

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Create isolated Home Assistant environment
        run: uv venv .ha-test --python 3.14

      - name: Verify state-only imports without media dependencies
        if: matrix.minimum
        run: |
          set -euo pipefail
          uv pip install --python .ha-test/bin/python \
            "homeassistant==${{ matrix.home-assistant-version }}" \
            --editable ./packages/cradlewise-client
          .ha-test/bin/python - <<'PY'
          import importlib

          from homeassistant.const import Platform

          from custom_components.cradlewise import BASE_PLATFORMS

          assert Platform.CAMERA not in BASE_PLATFORMS
          for platform in BASE_PLATFORMS:
              importlib.import_module(f"custom_components.cradlewise.{platform}")
          PY

      - name: Install Home Assistant test runtime
        run: |
          set -euo pipefail
          uv pip install --python .ha-test/bin/python \
            "pytest-homeassistant-custom-component==${{ matrix.ha-test-version }}" \
            --editable ./packages/cradlewise-client

      - name: Install the tested Home Assistant media requirements
        run: |
          .ha-test/bin/python - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys

          import homeassistant

          components = Path(homeassistant.__file__).parent / "components"
          requirements = []
          for domain in ("stream", "ffmpeg"):
              manifest = json.loads((components / domain / "manifest.json").read_text())
              requirements.extend(manifest["requirements"])
          subprocess.run(
              ["uv", "pip", "install", "--python", sys.executable, *requirements],
              check=True,
          )
          PY

      - name: Verify Home Assistant version
        run: |
          actual="$(
            .ha-test/bin/python -c \
              'from importlib.metadata import version; print(version("homeassistant"))'
          )"
          test "${actual}" = "${{ matrix.home-assistant-version }}"

      - name: Run Home Assistant integration tests
        run: >-
          .ha-test/bin/python -m pytest
          tests/test_ha_integration.py tests/test_ha_coordinator.py

  home-assistant-test:
    runs-on: ubuntu-latest
    needs: home-assistant-versions
    permissions:
      contents: read

    steps:
      - name: Confirm supported Home Assistant versions passed
        run: echo "All Home Assistant version checks passed"

  home-assistant-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb  # master

      - name: Run HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa  # main
        with:
          category: integration
          comment: false

  release-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify release versions
        shell: bash
        run: |
          set -euo pipefail
          expected_version="${GITHUB_REF_NAME#v}"
          root_version=$(uv version --package cradlewise-local --short)
          client_version=$(uv version --package cradlewise-client --short)
          integration_version=$(python -c 'import json; print(json.load(open("custom_components/cradlewise/manifest.json"))["version"])')
          integration_requirement=$(python -c 'import json; print(json.load(open("custom_components/cradlewise/manifest.json"))["requirements"][0])')
          environment_version=$(sed -n 's/^CRADLEWISE_BRIDGE_VERSION=//p' .env.example)
          compose_version=$(sed -n 's/.*CRADLEWISE_BRIDGE_VERSION:-\([^}]*\).*/\1/p' examples/docker-compose.yaml)
          test "$root_version" = "$expected_version"
          test "$client_version" = "$expected_version"
          test "$integration_version" = "$expected_version"
          test "$integration_requirement" = "cradlewise-client==$expected_version"
          test "$environment_version" = "$expected_version"
          test "$compose_version" = "$expected_version"

  client-package-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - release-versions
      - dependabot-audit
      - test
      - lint
      - home-assistant-test
      - home-assistant-validation

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Build client distribution
        run: uv build --package cradlewise-client

      - name: Upload client distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cradlewise-client-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  bridge-image-build:
    needs:
      - release-versions
      - dependabot-audit
      - test
      - lint
      - home-assistant-test
      - home-assistant-validation
    uses: ./.github/workflows/bridge-image.yml
    with:
      retain-image: true

  client-package-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - client-package-build
      - bridge-image-build
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download client distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: cradlewise-client-dist
          path: dist/

      - name: Publish client distribution to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist/

  bridge-image-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - dependabot-audit
      - client-package-build
      - bridge-image-build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download tested images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: bridge-image-*
          path: images/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          images: ${{ env.BRIDGE_IMAGE }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Publish the exact tested images and multi-architecture tags
        env:
          IMAGE_METADATA: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          images=()
          for arch in amd64 arm64; do
            docker load --input "images/bridge-image-${arch}/bridge-image.tar"
            ref="${BRIDGE_IMAGE}:build-${GITHUB_SHA}-${arch}"
            docker tag "cradlewise-bridge:ci-${arch}" "$ref"
            docker push "$ref"
            images+=("$ref")
          done
          while IFS= read -r tag; do
            docker buildx imagetools create --tag "$tag" "${images[@]}"
          done < <(jq -r '.tags[]' <<< "$IMAGE_METADATA")

  github-release:
    runs-on: ubuntu-latest
    needs:
      - client-package-publish
      - bridge-image-publish
    permissions:
      contents: write

    steps:
      - name: Download client distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: cradlewise-client-dist
          path: dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"
