name: Bridge image validation

on:
  workflow_call:
    inputs:
      retain-image:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  image:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: cradlewise-bridge:ci-${{ matrix.arch }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4

      - name: Build final image on its native architecture
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          no-cache-filters: runtime-base
          tags: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=bridge-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=bridge-${{ matrix.arch }}

      - name: Smoke test the final restricted runtime
        run: |
          set -euo pipefail
          runtime=(--rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 256 --tmpfs '/tmp:rw,noexec,nosuid,size=64m')
          docker run "${runtime[@]}" "$IMAGE" --help
          docker run "${runtime[@]}" --entrypoint cradlewise-pin-mqtt-ca "$IMAGE" --help
          docker run -i "${runtime[@]}" --entrypoint python "$IMAGE" - < tests/bridge_image_smoke.py
          docker run "${runtime[@]}" --entrypoint ffmpeg "$IMAGE" \
            -hide_banner -loglevel error -f lavfi -i testsrc2=size=128x72:rate=10 \
            -f lavfi -i sine=frequency=440:sample_rate=48000 -t 1 \
            -c:v libx264 -c:a aac -f mpegts pipe:1 |
            docker run -i "${runtime[@]}" --entrypoint ffmpeg "$IMAGE" \
              -hide_banner -loglevel error -i pipe:0 -f null -

      - name: Install vulnerability scanner
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.3.1
        with:
          version: v0.74.0

      - name: Scan complete final image, including unfixed findings
        run: >-
          trivy image --scanners vuln --timeout 10m --format json
          --output image-security.json "$IMAGE"

      - name: Block fixable high and critical vulnerabilities
        run: >-
          trivy image --scanners vuln --timeout 10m --ignore-unfixed
          --severity HIGH,CRITICAL --exit-code 1 "$IMAGE"

      - name: Retain complete security report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: image-security-${{ matrix.arch }}
          path: image-security.json
          if-no-files-found: error
          retention-days: 30

      - name: Export tested image for release
        if: inputs.retain-image
        run: docker save --output bridge-image.tar "$IMAGE"

      - name: Retain tested release image
        if: inputs.retain-image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: bridge-image-${{ matrix.arch }}
          path: bridge-image.tar
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
