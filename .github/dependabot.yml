version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns:
          - "*"
    # The current HA test runtime pins these exact versions. Security alerts
    # still block releases, while routine upgrades resume with the HA pin bump.
    ignore:
      - dependency-name: cryptography
        versions:
          - ">48.0.1"
      - dependency-name: pytest
        versions:
          - ">9.0.3"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      container-dependencies:
        patterns:
          - "*"
