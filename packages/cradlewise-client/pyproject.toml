[project]
name = "cradlewise-client"
version = "0.1.0"
description = "Local-first Cradlewise state and control client"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "caffeineflo"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "boto3>=1.34.0,<2.0.0",
  "cryptography>=42.0.0,<49.0.0",
  "paho-mqtt>=2.0.0,<3.0.0",
  "pycognito>=2024.5.1,<2025.0.0",
  "requests>=2.31.0,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/caffeineflo/cradlewise-local"
Issues = "https://github.com/caffeineflo/cradlewise-local/issues"
Source = "https://github.com/caffeineflo/cradlewise-local/tree/main/packages/cradlewise-client"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cradlewise_client"]
