- id: cradlewise_wake_recording
  alias: Cradlewise Wake Recording
  description: Records wake events with two minutes before and after the trigger.
  mode: single
  max_exceeded: silent
  triggers:
    - trigger: state
      entity_id: sensor.cradlewise_sleep_phase
      from: "sleep"
      to: "awake"
      id: sleep_phase_awake
    - trigger: state
      entity_id: sensor.cradlewise_sleep_phase
      from: "sleep"
      to: "stirring"
      id: sleep_phase_stirring
    - trigger: state
      entity_id: sensor.cradlewise_sleep_state
      from: "Light sleep"
      to: "Quite Awake"
      id: light_sleep_quite_awake
    - trigger: state
      entity_id: sensor.cradlewise_sleep_state
      from: "Light sleep"
      to: "Active Awake"
      id: light_sleep_active_awake
    - trigger: state
      entity_id: sensor.cradlewise_sleep_state
      from: "Deep sleep"
      to: "Quite Awake"
      id: deep_sleep_quite_awake
    - trigger: state
      entity_id: sensor.cradlewise_sleep_state
      from: "Deep sleep"
      to: "Active Awake"
      id: deep_sleep_active_awake
    - trigger: state
      entity_id: binary_sensor.cradlewise_baby_needs_attention
      to: "on"
      id: baby_needs_attention
    - trigger: state
      entity_id: binary_sensor.cradlewise_baby_needs_help
      to: "on"
      id: baby_needs_help
  conditions:
    - condition: state
      entity_id: binary_sensor.cradlewise_baby_present
      state: "on"
  actions:
    - action: camera.record
      target:
        entity_id: camera.cradlewise
      data:
        filename: >-
          /media/cradlewise-wake/events/cradlewise_wake_{{ now().strftime('%Y%m%d-%H%M%S') }}.mp4
        duration: 120
        lookback: 120

- id: cradlewise_wake_retention
  alias: Cradlewise Wake Recording Retention
  description: Deletes Cradlewise wake recordings after 14 days.
  mode: single
  triggers:
    - trigger: homeassistant
      event: start
    - trigger: time
      at: "03:15:00"
  actions:
    - action: shell_command.cradlewise_wake_retention
