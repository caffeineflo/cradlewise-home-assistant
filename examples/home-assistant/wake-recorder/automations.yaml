- id: cradlewise_wake_buffer_start
  alias: Cradlewise Wake Buffer Start
  description: Starts the rolling Cradlewise video buffer used for wake recordings.
  mode: single
  triggers:
    - trigger: homeassistant
      event: start
  actions:
    - action: shell_command.cradlewise_wake_buffer_start

- id: cradlewise_wake_recording
  alias: Cradlewise Wake Recording
  description: Records wake events with two minutes before and after the event.
  mode: single
  max_exceeded: silent
  triggers:
    - trigger: state
      entity_id: sensor.cradlewise_local_sleep_phase
    - trigger: state
      entity_id: sensor.cradlewise_local_sleep_state
    - trigger: state
      entity_id:
        - binary_sensor.cradlewise_local_baby_needs_attention
        - binary_sensor.cradlewise_local_baby_needs_help
      to: "on"
  conditions:
    - condition: template
      value_template: >-
        {{ is_state('binary_sensor.cradlewise_local_baby_present', 'on')
           and (
             trigger.entity_id not in [
               'sensor.cradlewise_local_sleep_phase',
               'sensor.cradlewise_local_sleep_state'
             ]
             or (
               trigger.from_state is not none
               and trigger.to_state is not none
               and (
                 (
                   trigger.entity_id == 'sensor.cradlewise_local_sleep_phase'
                   and trigger.from_state.state == 'sleep'
                   and trigger.to_state.state in ['awake', 'stirring']
                 )
                 or (
                   trigger.entity_id == 'sensor.cradlewise_local_sleep_state'
                   and trigger.from_state.state in ['Light sleep', 'Deep sleep']
                   and trigger.to_state.state in ['Quite Awake', 'Active Awake']
                 )
               )
             )
           ) }}
  actions:
    - action: shell_command.cradlewise_wake_event_record
